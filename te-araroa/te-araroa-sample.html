<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-color: #f0f0f0; /* Optional: adds a light gray background */
        }

        .image-column {
            width: min(600px, 100%);
            padding: 10px;
            box-sizing: border-box;
            background-color: #fff; /* Optional: adds a white background to the column */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Optional: adds a subtle shadow */
        }

        .image-column img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 20px;
            border-radius: 8px; /* Optional: adds rounded corners to images */
        }
    </style>
</head>
<body>

    <div class="image-column">
        <img src="page1.png" alt="Page 1">
        <img src="page2.png" alt="Page 2">
        <img src="page3.png" alt="Page 3">
        <img src="page4.png" alt="Page 4">
        <img src="page5.png" alt="Page 5">
        <img src="page6.png" alt="Page 6">
        <img src="page7.png" alt="Page 7">
        <img src="page8.png" alt="Page 8">
        <img src="page9.png" alt="Page 9">
        <img src="page10.png" alt="Page 10">
        <img src="page11.png" alt="Page 11">
        <img src="page12.png" alt="Page 12">
        <img src="page13.png" alt="Page 13">
        <img src="page14.png" alt="Page 14">
        <img src="page15.png" alt="Page 15">
        <img src="page16.png" alt="Page 16">
        <img src="page17.png" alt="Page 17">
        <img src="page18.png" alt="Page 18">
    </div>

</body>
</html>
